name: docker

# Постоянная проверка поставки: образ собирается, compose валиден, контейнеры поднимаются,
# /api/health отвечает, и в контейнере проходит герметичный смоук API и хранилища на PostgreSQL.
#
# Зачем отдельно от `tests`: юнит-тесты идут на голом Python и не проверяют ни Dockerfile, ни compose,
# ни совместимость версий в образе, ни работу SQLAlchemy на PostgreSQL вместо SQLite. Здесь
# проверяется именно поставка.
#
# Когда запускается: на каждый pull request, на задачных ветках и вручную. Сети наружу задание
# не требует: смоук поиска подменяет конвейер (scripts/smoke_api.py) и ходит только в свою базу.

on:
  pull_request:
  push:
    branches: [main, 'task/**']
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Файл окружения для compose
        run: cp .env.example .env

      - name: docker compose config
        run: docker compose config

      - name: docker build
        run: docker build -t wsignals-app:ci .

      - name: Запуск базы и API
        run: |
          docker compose up -d db api
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo starting)
            echo "api health: $state"
            [ "$state" = "healthy" ] && break
            sleep 5
          done
          test "$state" = "healthy" || { docker compose logs api; exit 1; }

      - name: /api/health отвечает
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/api/health)
          cat /tmp/health.json; echo
          test "$code" = "200"
          python -c "import json;d=json.load(open('/tmp/health.json'));assert d['status']=='ok',d;assert d['model'] is True,d;assert d['database']=='ok',d;print('health ok')"

      - name: Герметичный смоук API и хранилища в контейнере
        run: |
          docker cp scripts "$(docker compose ps -q api)":/app/scripts
          docker compose exec -T api python scripts/smoke_api.py

      - name: Запуск интерфейса и его /_stcore/health
        run: |
          docker compose up -d ui
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/ui_health.txt -w '%{http_code}' http://localhost:8501/_stcore/health || echo 000)
            echo "ui health: $code $(cat /tmp/ui_health.txt 2>/dev/null)"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 2
          done
          running=$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -q ui)" 2>/dev/null || echo false)
          echo "ui running: $running"
          if [ "$ok" != "1" ] || [ "$running" != "true" ]; then
            docker compose ps
            docker compose logs --no-color --tail 200 ui
            exit 1
          fi
          root=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/)
          echo "ui root: $root"
          test "$root" = "200"

      - name: Логи при отказе
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Остановка
        if: always()
        run: docker compose down -v
