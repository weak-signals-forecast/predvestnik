<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Предвестник — ранние технологические сигналы для бизнеса">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a5c"/><stop offset="0.6" stop-color="#1f5fd1"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="orn" width="40" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fff" stroke-width="1.3">
        <path d="M20 4 L36 20 L20 36 L4 20 Z"/><path d="M20 12 L28 20 L20 28 L12 20 Z"/><path d="M20 12 V28 M12 20 H28"/>
      </g>
      <g fill="#fff"><circle cx="0" cy="0" r="2"/><circle cx="40" cy="0" r="2"/><circle cx="0" cy="40" r="2"/><circle cx="40" cy="40" r="2"/></g>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.55" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#orn)" opacity="0.14" mask="url(#m)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(62 104) rotate(45)">
      <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#7dd3fc"/>
      <rect x="-17" y="-17" width="34" height="34" rx="4" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="6"/>
    </g>
    <text x="96" y="124" fill="#fff" font-size="64" font-weight="700" letter-spacing="-1">Предвестник</text>
    <text x="50" y="176" fill="#fff" fill-opacity="0.92" font-size="26" font-weight="600">Ранние технологические сигналы для бизнеса — с объяснением:</text>
    <text x="50" y="210" fill="#fff" fill-opacity="0.88" font-size="26">почему именно эта технология и почему сейчас.</text>
    <g font-size="16" fill="#fff">
      <rect x="50" y="240" width="322" height="34" rx="17" fill="#fff" fill-opacity="0.15"/><text x="211" y="262" text-anchor="middle">ТОП-15 по запросу в свободной форме</text>
      <rect x="384" y="240" width="268" height="34" rx="17" fill="#fff" fill-opacity="0.15"/><text x="518" y="262" text-anchor="middle">источники с уровнем доверия</text>
      <rect x="664" y="240" width="246" height="34" rx="17" fill="#fff" fill-opacity="0.15"/><text x="787" y="262" text-anchor="middle">объяснение каждого сигнала</text>
      <rect x="922" y="240" width="196" height="34" rx="17" fill="#fff" fill-opacity="0.15"/><text x="1020" y="262" text-anchor="middle">проверка на прошлом</text>
    </g>
  </g>
</svg>
