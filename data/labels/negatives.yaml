# Отрицательные примеры для обучения: то, что НЕ является слабым сигналом.
# Их нет в таблице организаторов, поэтому датасет достроен по явным критериям ТЗ.
#
# mainstream   зрелая или массово внедрённая технология: сформирован рынок, есть лидеры и стандарты,
#              либо это общий зонт-термин, внутри которого живут конкретные сигналы (hard negatives:
#              «federated learning» против «федеративного обучения для межбанковского AML»).
# faded_hype   хайп, который прошёл пик и угас: был массовым в медиа, внедрения не состоялось.
#
# Области совпадают с таблицей «100 слабых сигналов», по ~25 зрелых и ~8 угасших на область,
# чтобы модель не могла отличать классы по теме, а только по поведению в источниках.

