# Направления мониторинга. У каждого:
#   cpc      - коды CPC для патентного слоя (Google Patents / Lens), пока не используются
#   queries  - фразы для поиска по заголовку и аннотации в OpenAlex
# Каждая фраза запрашивается отдельно, результаты объединяются и дедуплицируются по id.
# Слова в двойных кавычках ищутся как точная фраза: без них OpenAlex ищет слова
# по отдельности, и "pipeline digital twin" тянет цифровые двойники водопроводов.
#
#   relevance - фильтр релевантности на ингесте. Применяется к заголовку и аннотации
#               (без аннотации: к заголовку и названию темы OpenAlex), без учёта регистра.
#     all_of  - список групп-регексов, документ должен совпасть с каждой группой
#               (без аннотации проверяется только первая группа по заголовку и теме OpenAlex)
#     none_of - список регексов-исключений, любое совпадение выбрасывает документ

hydrogen:
  title: Водород и пиролиз метана
  cpc:
  - C01B3/
  - C01B32/05
  - C25B1/
  - H01M8/
  queries:
  - methane pyrolysis hydrogen
  - turquoise hydrogen
  - blue hydrogen natural gas reforming
  - hydrogen blending natural gas pipeline
  - hydrogen embrittlement pipeline steel
  - ammonia hydrogen carrier
  relevance:
    all_of:
    - hydrogen|methane|natural gas|syngas|\bh2\b|\bch4\b
    none_of:
    - nitrate reduction|nitrate-to-ammonia|photocatalytic degradation|dye degradation|lithium[- ]ion|solar cell
