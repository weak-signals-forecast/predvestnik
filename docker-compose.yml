name: wsignals

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wsignals
      POSTGRES_PASSWORD: wsignals
      POSTGRES_DB: wsignals
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsignals"]
      interval: 5s
      retries: 10

  api:
    build: .
    image: wsignals-app:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wsignals:wsignals@db:5432/wsignals
      WSIGNALS_CACHE: /app/data/cache
      # Реестр прогнозов на томе: иначе он исчезает вместе с контейнером.
      WSIGNALS_FORECAST_REGISTRY: /app/data/forecasts/registry.jsonl
    volumes:
      - cache:/app/data/cache
      - forecasts:/app/data/forecasts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: wsignals-app:latest
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  # база слабых сигналов: поиск по заранее собранной базе + выбор YandexGPT (Dockerfile.registry)
  registry:
    build:
      context: .
      dockerfile: Dockerfile.registry
    image: wsignals-registry:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wsignals:wsignals@db:5432/wsignals
      REGISTRY_CACHE: /cache
    volumes:
      - registry_cache:/cache
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  cache:
  forecasts:
  registry_cache:
